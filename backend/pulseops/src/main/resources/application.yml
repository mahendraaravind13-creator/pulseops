server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pulseops

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulseops}
    username: ${DB_USER:pulseops}
    password: ${DB_PASSWORD:pulseops}
    hikari:
      # Two app instances x 10 connections stays far below Postgres' default max_connections (100).
      # Most work is short indexed queries, so a small pool with a fast failure is better than a big queue.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks the mapping matches it
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 2000          # do not hang an HTTP thread for 60s when the broker is down
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
    consumer:
      group-id: pulseops-evaluator
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 100
    listener:
      ack-mode: record              # commit the offset only after the listener (and its DB transaction) succeeded
      concurrency: 3

  threads:
    virtual:
      enabled: true                 # blocking I/O (Gemini, webhooks) parks cheap virtual threads

pulseops:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 12h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  kafka:
    samples-topic: telemetry.samples
    dead-letter-topic: telemetry.samples.dlq
    partitions: 3
  monitoring:
    stale-after: 60s
    retention-days: 7
    snapshot-ttl: 5m
    default-rate-limit-per-minute: 600
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout: 15s
    max-attempts: 3
  webhook:
    max-attempts: 5
    timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
  metrics:
    tags:
      application: pulseops

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [req=%X{requestId:-} tenant=%X{tenantId:-}]"
  level:
    org.apache.kafka: WARN
