# Docker's embedded DNS server. valid=10s makes nginx re-resolve names every 10 seconds,
# so replicas added or removed with `docker compose up --scale app=N` are picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

# Why a named upstream with `resolve` instead of a variable in proxy_pass:
# - A plain `server app:8080;` is resolved once at startup. It does round-robin across the
#   replicas that existed then, but never notices new or removed ones (and nginx refuses to
#   start if `app` is not resolvable yet).
# - `set $backend http://app:8080; proxy_pass $backend;` re-resolves, but every request builds a
#   throwaway upstream, so there is no shared state, no named upstream and no keepalive pool.
# - `server app:8080 resolve;` (open-source nginx since 1.27.3, needs a shared `zone`) keeps the
#   named upstream, re-resolves it with the resolver above, round-robins across every A record
#   Docker returns (one per replica), and lets proxy_next_upstream retry on another replica.
upstream pulseops_app {
    zone pulseops_app 64k;
    server app:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Shared proxy settings for every backend location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # If a replica is dead or overloaded, try the next one instead of failing the request.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    location /api/ {
        proxy_pass http://pulseops_app;
    }

    location /swagger-ui {
        proxy_pass http://pulseops_app;
    }

    location /v3/api-docs {
        proxy_pass http://pulseops_app;
    }

    location /actuator/ {
        proxy_pass http://pulseops_app;
    }

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html so React Router can handle them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
