# PulseOps: the whole stack with one command.
#
#   cp .env.example .env        # then set JWT_SECRET (and GEMINI_API_KEY if you want AI suggestions)
#   docker compose up -d --build
#   open http://localhost:8088
#
# Topology:
#   browser / agent --> web (nginx :8088) --round-robin--> app x2 --> postgres, redis, kafka
#
# Run only the infrastructure (to start the backend from your IDE instead):
#   docker compose up -d postgres redis kafka

# Explicit project name: container, network and volume names start with "pulseops-stack", so this stack never
# collides with containers or volumes created by the old two-service setup.
name: pulseops-stack

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: ${DB_USER:-pulseops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulseops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulseops} -d pulseops"]
      interval: 5s
      timeout: 3s
      start_period: 90s   # first boot initialises the data directory, which can be slow on Docker Desktop
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single Kafka broker in KRaft mode (no ZooKeeper).
  # Two listeners: kafka:19092 for containers on the compose network, localhost:9092 for apps on your machine.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared by the app (KafkaConfig)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # The Spring Boot application. Two identical, stateless replicas: nginx balances HTTP across them and the
  # Kafka consumer group splits the topic's partitions between them.
  app:
    build: ./backend/pulseops
    deploy:
      replicas: 2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pulseops
      DB_USER: ${DB_USER:-pulseops}
      DB_PASSWORD: ${DB_PASSWORD:-pulseops}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      CORS_ALLOWED_ORIGINS: http://localhost:8088
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    restart: unless-stopped

  # nginx: serves the React build and load-balances /api across the app replicas (see frontend/nginx.conf).
  web:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
