name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + unit + Testcontainers integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/pulseops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # GitHub-hosted Ubuntu runners have Docker, which Testcontainers uses for PostgreSQL, Kafka and Redis.
      - run: mvn -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Docker images and compose file
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-only-placeholder-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build app web
